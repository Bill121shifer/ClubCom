<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign Up · Clubcom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Istok+Web:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="screen">
    <header class="welcome">
      <p class="eyebrow">WELCOME TO</p>
      <h1 class="brand"><a href="/">CLUBCOM!</a></h1>
      <p class="tagline">Make your account in a minute.</p>
    </header>

    <section class="panel" aria-labelledby="title">
      <h2 class="page-title" id="title">Sign Up</h2>
      <form id="form" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
          <p class="hint">At least 6 characters.</p>
        </div>
        <p class="message" id="msg" role="status" hidden></p>
        <button class="btn small" id="submit" type="submit">Create account</button>
      </form>
      <p class="switch">Already have an account? <a class="link" href="/login.html">Log in</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase.js"></script>
  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        showMessage(msg, "Fill in your name, email and password.", "error");
        return;
      }
      if (password.length < 6) {
        showMessage(msg, "Your password needs at least 6 characters.", "error");
        return;
      }

      submit.disabled = true;
      submit.textContent = "Creating…";

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: location.origin + "/login.html?confirmed=1"
        }
      });

      submit.disabled = false;
      submit.textContent = "Create account";

      if (error) {
        showMessage(msg, friendlyError(error), "error");
        return;
      }
      if (data.session) {
        location.replace("/chats.html");
      } else {
        form.reset();
        showMessage(msg, "Account created. Check your email for a confirmation link, then log in.", "ok");
      }
    });
  </script>
</body>
</html>
